name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # ruby-head is an early warning only; RIDL's optparse extension does not
    # yet support Ruby head's OptionParser.
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', 'head']
    steps:
      - name: Check out idl2xmi
        uses: actions/checkout@v7

      - name: Check out RIDL master
        uses: actions/checkout@v7
        with:
          repository: RemedyIT/ridl
          ref: master
          path: _ridl

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
        env:
          RUBYLIB: ${{ github.workspace }}/_ridl/lib
