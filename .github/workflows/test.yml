name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out idl2xmi
        uses: actions/checkout@v7

      - name: Check out RIDL master
        uses: actions/checkout@v7
        with:
          repository: RemedyIT/ridl
          ref: master
          path: _ridl

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Generate XMI golden output for review
        run: |
          bundle exec ruby script/idl2xmi.rb test/fixtures/struct_one_member.idl /tmp/struct_one_member.xmi
          bundle exec ruby script/idl2xmi.rb test/fixtures/all_basic_types.idl /tmp/all_basic_types.xmi
          bundle exec ruby script/idl2xmi.rb test/fixtures/enum.idl /tmp/enum.xmi
          cat /tmp/struct_one_member.xmi
          cat /tmp/all_basic_types.xmi
          cat /tmp/enum.xmi
        env:
          RUBYLIB: ${{ github.workspace }}/_ridl/lib

      - name: Run tests
        run: bundle exec rake test
        env:
          RUBYLIB: ${{ github.workspace }}/_ridl/lib
